name: userdata

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: userdata-root for 21H16
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: work

      - name: Disk space
        run: df -h /

      - name: Resolve the IPSW url
        working-directory: work
        run: |
          set -eux
          curl -sS -m 60 "https://api.ipsw.me/v4/device/iPhone15,2?type=ipsw" -o ipsw.json
          url=$(python3 -c "import json;d=json.load(open('ipsw.json'));print([f for f in d['firmwares'] if f['buildid']=='21H16'][0]['url'])")
          echo "IPSW_URL=$url" >> "$GITHUB_ENV"
          echo "$url"

      - name: Fetch the signed policies
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          B="https://api.github.com/repos/${{ github.repository }}"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$B/actions/artifacts?name=verified-root-policies&per_page=1" -o art.json
          id=$(python3 -c "import json;d=json.load(open('art.json'));print(d['artifacts'][0]['id'] if d['artifacts'] else '')")
          [ -n "$id" ] || { echo "no policy artifact"; exit 1; }
          curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "$B/actions/artifacts/$id/zip" -o policies.zip
          mkdir -p policies && unzip -q policies.zip -d policies
          ls -l policies/os policies/systemos

      - name: Build the userdata parts
        working-directory: work
        run: |
          set -eux
          python3 ci/prepare_userdata_mac.py --url "$IPSW_URL" --policies policies --out out --work disks
          df -h /
          ls -l out

      - name: Split for transfer
        working-directory: work/out
        run: |
          set -eux
          split -b 1800M -d -a 1 userdata-part0.img p0-
          split -b 1800M -d -a 1 userdata-part1.img p1-
          shasum -a 256 userdata-part0.img userdata-part1.img > parts.sha256
          ls -l

      - name: Upload part 0
        uses: actions/upload-artifact@v4
        with:
          name: userdata-a
          path: |
            work/out/p0-*
            work/out/parts.sha256
            work/out/userdata-root.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: userdata-b
          path: |
            work/out/p1-*
          if-no-files-found: error
          retention-days: 14
