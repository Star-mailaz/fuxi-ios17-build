name: userdata

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: userdata-root for 21H16
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: work

      - name: Disk space before
        run: df -h /

      - name: Install dmg2img
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq dmg2img || true
          which dmg2img || echo "dmg2img missing"
          dmg2img -h 2>&1 | head -3 || true

      - name: Fetch the 21H16 IPSW
        working-directory: work
        run: |
          set -eux
          curl -sS -m 60 "https://api.ipsw.me/v4/device/iPhone15,2?type=ipsw" -o ipsw.json
          url=$(python3 -c "import json;d=json.load(open('ipsw.json'));print([f for f in d['firmwares'] if f['buildid']=='21H16'][0]['url'])")
          echo "url=$url"
          curl -L --retry 3 -o ipsw.zip "$url"
          ls -l ipsw.zip

      - name: Fetch the signed policies
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          B="https://api.github.com/repos/${{ github.repository }}"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$B/actions/artifacts?name=verified-root-policies&per_page=1" -o art.json
          id=$(python3 -c "import json;d=json.load(open('art.json'));print(d['artifacts'][0]['id'] if d['artifacts'] else '')")
          [ -n "$id" ] || { echo "no policy artifact"; exit 1; }
          curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "$B/actions/artifacts/$id/zip" -o policies.zip
          mkdir -p policies && unzip -q policies.zip -d policies
          ls -l policies/os policies/systemos | head -20

      - name: Build the userdata image
        working-directory: work
        run: |
          set -eux
          df -h /
          python3 ci/prepare_userdata.py --ipsw ipsw.zip --policies policies --out out/userdata-root.img --work disks
          ls -l out/
          df -h /

      - name: Split and checksum
        working-directory: work
        run: |
          set -eux
          cd out
          sha256sum userdata-root.img > userdata-root.img.sha256
          split -b 1800M -d -a 1 userdata-root.img part-
          ls -l
          sha256sum part-* > parts.sha256

      - name: Upload part A
        uses: actions/upload-artifact@v4
        with:
          name: userdata-part-a
          path: |
            work/out/part-0
            work/out/part-1
            work/out/part-2
            work/out/parts.sha256
            work/out/userdata-root.img.sha256
            work/out/userdata-root.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload part B
        uses: actions/upload-artifact@v4
        with:
          name: userdata-part-b
          path: |
            work/out/part-3
            work/out/part-4
            work/out/part-5
          if-no-files-found: warn
          retention-days: 14
