name: scyx-root-image

on:
  workflow_dispatch:
    inputs:
      size:
        description: HFS+ image size
        default: 16G

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Disk
        run: |
          df -h /; nproc; free -g | head -2
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          repository: scyx2611/fuxi-ios
          path: harness
          persist-credentials: false
      - name: Check out these helpers
        uses: actions/checkout@v4
        with:
          path: ci-self
          persist-credentials: false
      - name: Host packages
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse3-dev cmake gcc g++ make pkg-config \
            zlib1g-dev libbz2-dev libssl-dev hfsprogs fuse3 rsync zstd unzip curl python3
      - name: Build apfs-fuse
        run: |
          set -eux
          sudo git clone --depth 1 --recursive https://github.com/sgan81/apfs-fuse.git /opt/apfs-fuse
          sudo cmake -S /opt/apfs-fuse -B /opt/apfs-fuse/build -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build /opt/apfs-fuse/build -j4
          sudo ln -sf "$(sudo find /opt/apfs-fuse/build -name apfs-fuse -type f | head -1)" /usr/local/bin/apfs-fuse
      - name: Download the IPSW
        run: |
          set -eux
          curl -sSL --retry 3 -o ipsw.zip \
            "https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
          mkdir -p ipsw && unzip -o -q ipsw.zip -d ipsw "*.dmg" "BuildManifest.plist" "Restore.plist"
          rm -f ipsw.zip; ls -lS ipsw | head -12
      - name: Map the dmgs
        run: |
          set -eux
          python3 ci-self/ci/root-roles.py ipsw/BuildManifest.plist > roles.txt || true
          cat roles.txt
      - name: Build the HFS+ root image
        run: |
          set -eux
          pick() { if [ -n "$1" ] && [ -f "ipsw/$1" ]; then echo "$1"; fi; }
          OS=$(pick "$(grep '^OS=' roles.txt | cut -d= -f2- || true)")
          SYS=$(pick "$(grep '^SystemOS=' roles.txt | cut -d= -f2- || true)")
          APP=$(pick "$(grep '^AppOS=' roles.txt | cut -d= -f2- || true)")
          echo "manifest: OS=$OS SYS=$SYS APP=$APP"
          mapfile -t BY < <(ls -S ipsw/*.dmg | sed 's|^ipsw/||')
          printf 'by size: %s\n' "${BY[*]}"
          # Fill only what the manifest did not resolve; never overwrite the OS role
          # (the previous run replaced a correct 4.7 GB OS with a 2.7 GB dmg).
          for c in "${BY[@]}"; do
            [ -n "$OS" ] && [ -n "$SYS" ] && [ -n "$APP" ] && break
            if [ "$c" = "$OS" ] || [ "$c" = "$SYS" ] || [ "$c" = "$APP" ]; then continue; fi
            if [ -z "$SYS" ]; then SYS=$c; elif [ -z "$APP" ]; then APP=$c; fi
          done
          # App cryptex is the small one: prefer the smallest unresolved dmg.
          if [ -z "$APP" ] || [ "$(stat -c%s "ipsw/$APP")" -gt 400000000 ]; then
            for c in $(ls -S -r ipsw/*.dmg | sed 's|^ipsw/||'); do
              [ "$c" = "$OS" ] && continue; [ "$c" = "$SYS" ] && continue; APP=$c; break
            done
          fi
          echo "picked: OS=$OS SYS=$SYS APP=$APP"
          ls -l "ipsw/$OS" "ipsw/$SYS" "ipsw/$APP"
          sudo bash harness/ios-fuxi/tools/mkiosroot.sh "ipsw/$OS" "ipsw/$SYS" "ipsw/$APP" "$PWD/iOSRoot.img" "${{ inputs.size }}" 2>&1 | tail -40
          ls -lh iOSRoot.img
          # Exact ios-sweet procedure: fsck, mount, apply the bring-up tweaks, unmount.
          sudo fsck.hfsplus -fy iOSRoot.img || true
          sudo mkdir -p /mnt/iosroot
          sudo mount -t hfsplus -o loop,force iOSRoot.img /mnt/iosroot
          sudo python3 harness/ios-fuxi/tools/sweet-root-tweaks.py /mnt/iosroot
          sudo umount /mnt/iosroot
          sudo fsck.hfsplus -fy iOSRoot.img || true
          img2simg iOSRoot.img iOSRoot.simg && ls -lh iOSRoot.simg
          sha256sum iOSRoot.img
      - name: Compress and split
        run: |
          set -eux
          gzip -1 -c iOSRoot.img > iOSRoot.img.gz
          ls -lh iOSRoot.img.gz
          mkdir -p out
          split -b 1700M -d iOSRoot.img.gz "out/iosroot-part-"
          sha256sum iOSRoot.img iOSRoot.img.gz out/* > out/SHA256SUMS
          ls -l out
          rm -f iOSRoot.img iOSRoot.img.gz
      - name: Publish to a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          # The checkout lives in a subdirectory, so $GITHUB_WORKSPACE is not a git
          # repository: every gh call must name the repository explicitly.
          tag=iosroot-${{ github.run_attempt }}
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
            --notes "fuxi iOS 16 root image (split)" || true
          for f in out/*; do gh release upload "$tag" "$f" --repo "$GITHUB_REPOSITORY" --clobber; done
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
