name: scyx-kernel

on:
  workflow_dispatch:
    inputs:
      ram:
        description: memory profile (full or 9g)
        default: 9g
      jobs:
        description: parallel jobs
        default: "4"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FUXI_BUILD_ROOT: /home/runner/fuxi-build
  UNIXNU_TOOLCHAIN: /home/runner/xnu-linux
  UNIXNU_SRC: /opt/src/UniXNU
  OUT_ROOT: ${{ github.workspace }}/out

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Probe the runner
        run: |
          uname -a; nproc; free -g | head -2; df -h / /home

      - name: Clone the project
        run: |
          set -eux
          git clone --quiet https://github.com/scyx2611/fuxi-ios.git "$GITHUB_WORKSPACE/scyx"
          git -C "$GITHUB_WORKSPACE/scyx" log --oneline -3
          du -sh "$GITHUB_WORKSPACE/scyx"
          test -f "$GITHUB_WORKSPACE/scyx/.github/workflows/kernel-adsp-battery.yml"
          test -f "$GITHUB_WORKSPACE/scyx/work/localbuild/fuxi-kernel-build.sh"

      - name: Clone UniXNU (toolchain sources and shims)
        run: |
          set -eux
          sudo mkdir -p /opt/src
          sudo chown -R "$USER" /opt/src
          git clone --quiet --depth 1 --branch fuxi https://github.com/SadNutWall/UniXNU /opt/src/UniXNU
          ls /opt/src/UniXNU/scripts/linux | head -20

      - name: Restore the Linux XNU toolchain
        id: tc
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/xnu-linux
          key: xnu-linux-toolchain-v1

      - name: Build the Linux XNU toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -eux
          if [ -x "$UNIXNU_TOOLCHAIN/llvm/bin/clang" ]; then echo "already present"; exit 0; fi
          sudo python3 /opt/src/UniXNU/scripts/linux/setup-toolchain.py "$UNIXNU_TOOLCHAIN" 2>&1 | tail -40
          ls "$UNIXNU_TOOLCHAIN"

      - name: Save the Linux XNU toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/xnu-linux
          key: xnu-linux-toolchain-v1

      - name: System packages
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq libbsd-dev uuid-dev zlib1g-dev libssl-dev libbz2-dev liblzma-dev \
            pkg-config libblocksruntime-dev device-tree-compiler unzip p7zip-full tcsh unifdef flex bison \
            autoconf automake libtool git patch rsync cpio wget curl python3 ca-certificates
      - name: Install the toolchain shims
        run: |
          set -eux
          P="$UNIXNU_TOOLCHAIN"
          SHIMS=/opt/src/UniXNU/scripts/linux
          BIN="$GITHUB_WORKSPACE/llvm-bin"
          mkdir -p "$BIN"
          ls "$P" || true
          ls "$SHIMS" || true
          for t in xcrun plutil codesign; do
            for cand in "$SHIMS/$t" "$P/bin/$t" "$P/CommandLineTools/usr/bin/$t"; do
              if [ -x "$cand" ]; then sudo ln -sf "$cand" "/usr/bin/$t"; echo "linked $t -> $cand"; break; fi
            done
          done
          for t in llvm-ar llvm-nm llvm-objcopy llvm-ranlib llvm-strip llvm-readelf ld.lld; do
            for cand in "$P/llvm/bin/$t" "$P/CommandLineTools/usr/bin/$t" "$P/bin/$t" /usr/bin/$t /usr/bin/$t-*; do
              if [ -x "$cand" ]; then ln -sf "$cand" "$BIN/$t"; sudo ln -sf "$cand" "/usr/bin/$t"; break; fi
            done
          done
          printf '#!/bin/sh\ncase "$1" in\n  --bindir) echo "%s" ;;\n  --version) echo "24.0.0" ;;\n  *) echo unsupported ;;\nesac\n' "$BIN" | sudo tee /usr/bin/llvm-config >/dev/null
          sudo chmod +x /usr/bin/llvm-config
          sudo ln -sf "$P/bin/lzfse" /usr/bin/lzfse 2>/dev/null || true
          for t in install gm4; do [ -x "$SHIMS/$t" ] && sudo ln -sf "$SHIMS/$t" "/usr/bin/$t"; done
          ls -l /usr/bin/xcrun /usr/bin/llvm-config || true
          /usr/bin/xcrun --version || true
      - name: Build the kernel
        working-directory: scyx
        run: |
          set -uo pipefail
          bash work/localbuild/fuxi-kernel-build.sh --ram "${{ inputs.ram }}" \
            --harness "$GITHUB_WORKSPACE/scyx" --jobs "${{ inputs.jobs }}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          rc=${PIPESTATUS[0]}
          echo "build rc=$rc"
          exit $rc

      - name: Report the outputs
        if: always()
        run: |
          set +e
          ls -lR "$OUT_ROOT" | head -60
          find "$OUT_ROOT" -name "*.fuxi*" -o -name "*.adt" | head -20
          df -h /

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-fuxi-${{ github.run_attempt }}
          path: |
            out/**
            build.log
          if-no-files-found: warn
          retention-days: 14
