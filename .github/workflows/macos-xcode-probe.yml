name: macos-xcode-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe26:
    runs-on: macos-26
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode_*.app 2>/dev/null | xargs -n1 basename | tr "\n" " "
          xcrun --sdk iphoneos --show-sdk-version || true
          df -h / | tail -1
  probelatest:
    runs-on: macos-latest
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode_*.app 2>/dev/null | xargs -n1 basename | tr "\n" " "
          xcrun --sdk iphoneos --show-sdk-version || true
          df -h / | tail -1
  probe15:
    runs-on: macos-15
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode_*.app 2>/dev/null | xargs -n1 basename | tr "\n" " "
          xcrun --sdk iphoneos --show-sdk-version || true