name: kernel-linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: arm64e kernel for 21H16
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      UNIXNU_OUT: ${{ github.workspace }}/work/unixnu/out-ios17
      UNIXNU_XNU_ARCH: arm64e
      UNIXNU_FILESET_KERNEL_FIRST: "1"
      XNU_KERNEL_CHAINED_FIXUPS: "1"
      JOBS: "8"
      PYTHONUNBUFFERED: "1"
      XNU_LINUX_PREFIX: /home/runner/xnu-linux
      UNIXNU_TOOLCHAIN: /home/runner/xnu-linux
      # The archive scripts import kernel_target.py from the UniXNU scripts directory,
      # but they run from the assembled tree (device side), which is not on sys.path.
      PYTHONPATH: ${{ github.workspace }}/work/unixnu/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          path: work

      - name: System dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq git cmake make clang python3 python3-pip flex bison \
            autoconf automake pkg-config uuid-dev zlib1g-dev libssl-dev libbz2-dev liblzma-dev \
            libbsd-dev unzip p7zip-full tcsh unifdef libblocksruntime-dev device-tree-compiler
          git clone --depth 1 https://github.com/swiftlang/swift-corelibs-libdispatch "$GITHUB_WORKSPACE/libdispatch"
          cmake -S "$GITHUB_WORKSPACE/libdispatch" -B "$GITHUB_WORKSPACE/libdispatch/build" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DINSTALL_PRIVATE_HEADERS=YES \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build "$GITHUB_WORKSPACE/libdispatch/build" -j 8
          sudo cmake --install "$GITHUB_WORKSPACE/libdispatch/build"
          sudo ldconfig
      - name: Clone UniXNU and the author repository
        working-directory: work
        run: |
          set -eux
          git clone --depth 1 --branch fuxi https://github.com/SadNutWall/UniXNU unixnu
          git clone --depth 1 https://github.com/Kerfand/UniXNU-Fuxi-Arm64e-iOS17 kerfand
          cp -R kerfand/device device
          cp -R kerfand/ios17 device-ios17
          test -f device/drivers/QcomXnuUsbDebug/kernel/QcomUsbControl.h
          grep -c SXNU_CONTROL_VERB_REBOOT_FASTBOOT device/drivers/QcomXnuUsbDebug/kernel/QcomUsbControl.h

      - name: Restore the Linux XNU toolchain
        id: tc-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/xnu-linux
          key: xnu-linux-toolchain-v1
      - name: Build the Linux XNU toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          if [ -x "$XNU_LINUX_PREFIX/llvm/bin/clang" ]; then echo "toolchain already cached"; exit 0; fi
          sudo python3 "$GITHUB_WORKSPACE/work/unixnu/scripts/linux/setup-toolchain.py" "$XNU_LINUX_PREFIX"
          ls "$XNU_LINUX_PREFIX"
          ls "$XNU_LINUX_PREFIX/llvm/bin/clang" "$XNU_LINUX_PREFIX/bin/lzfse" || true

      - name: Save the Linux XNU toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/xnu-linux
          key: xnu-linux-toolchain-v1
      - name: Install the toolchain shims into /usr/bin
        run: |
          set -eux
          SHIMS="$GITHUB_WORKSPACE/work/unixnu/scripts/linux"
          for t in xcrun plutil codesign; do
            src="$SHIMS/$t"
            [ -x "$src" ] || src="$XNU_LINUX_PREFIX/bin/$t"
            if [ -x "$src" ]; then sudo ln -sf "$src" "/usr/bin/$t"; echo "linked $t -> $src"; else echo "MISSING $t"; fi
          done
          ls -l /usr/bin/xcrun /usr/bin/plutil /usr/bin/codesign
          /usr/bin/xcrun --version || true
      - name: Apply the UniXNU patch and clone the submodules at head
        working-directory: work
        run: |
          set -eux
          git -C unixnu apply "$(pwd)"/kerfand/unixnu/commits/UniXNU/*.patch
          cd unixnu
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read key path; do
            urlkey=$(echo "$key" | sed 's/[.]path$/.url/')
            url=$(git config -f .gitmodules --get "$urlkey")
            pin=$(git ls-tree HEAD -- "$path" | awk '{print $3}')
            rm -rf "$path"
            git clone --depth 1 --quiet "$url" "$path" || echo "CLONE FAILED $path"
            if [ -n "$pin" ] && git -C "$path" fetch -q --depth 1 origin "$pin" 2>/dev/null; then
              git -C "$path" checkout -q "$pin" && echo "pinned $path @ $(echo $pin | cut -c1-8)"
            else
              echo "head $path (pin $pin unavailable)"
            fi
          done
          git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | while read key path; do
            name=$(echo "$key" | sed 's/^submodule[.]//; s/[.]path$//')
            git config "submodule.$name.update" none
            git config -f .gitmodules "submodule.$name.update" none
          done
          ls drivers kits | head -40

      - name: Copy the untracked files
        working-directory: work
        run: |
          set -eux
          cp -R kerfand/unixnu/files/. unixnu/ 2>/dev/null || true
          cp -R kerfand/unixnu/patches/. unixnu/patches/ 2>/dev/null || true
          # The device scripts run from the assembled tree and import the kernel target helper,
          # which only exists in the UniXNU scripts directory. Seed the device scripts with it.
          # kernel_target.py exists on UniXNU main but not on the fuxi branch.
          if [ ! -f unixnu/scripts/kernel_target.py ]; then
            curl -fsSL "https://raw.githubusercontent.com/SadNutWall/UniXNU/main/scripts/kernel_target.py" -o unixnu/scripts/kernel_target.py || echo "download failed"
          fi
          mkdir -p device/scripts
          cp -f unixnu/scripts/kernel_target.py device/scripts/kernel_target.py || echo "copy failed"
          ls -l unixnu/scripts/kernel_target.py device/scripts/kernel_target.py || true

      - name: Apply the module diffs to the real submodules
        working-directory: work
        run: |
          set +e
          base () { repo=$1; sha=$2
            if git -C "$repo" fetch -q --depth 1 origin "$sha" 2>/dev/null; then git -C "$repo" checkout -q "$sha" && echo "  base $sha"; else echo "  base $sha unavailable"; fi; }
          apply () { repo=$1; name=$2; patch=$(pwd)/kerfand/unixnu/diffs/$3
            if [ ! -s "$patch" ]; then echo "$name: empty"; return 0; fi
            if git -C "$repo" apply "$patch" 2>/dev/null; then echo "$name: applied"; return 0; fi
            if ( cd "$repo" && patch -p1 -F3 -s < "$patch" ) 2>/dev/null; then echo "$name: applied (patch)"; return 0; fi
            echo "$name: FAILED"; }
          base unixnu/drivers/Adreno740 a9a2cbb43b89d672e2921e19721a6438b738b17f
          base unixnu/drivers/AdrenoMetal 5d56587b301ed42b4742528aac9d3a40774ad9aa
          base unixnu/drivers/DarwinBoot 3c75734014cdab0acd9541e88057b7606ee7ae08
          base unixnu/drivers/GopFramebuffer 19ef3a75ad2c53da85b8d923553d922716fce377
          base unixnu/kits/VerifiedRoot 974f043d0c71ba2e60331483a41c6c6d35274ee3
          base unixnu/kits/XnuPrelink ddb7afa0046668b3d44efe0cc5c986f1c442644d
          apply unixnu/drivers/Adreno740 Adreno740 drivers_Adreno740.diff
          apply unixnu/drivers/AdrenoMetal AdrenoMetal drivers_AdrenoMetal.diff
          apply unixnu/drivers/DarwinBoot DarwinBoot drivers_DarwinBoot.diff
          apply unixnu/drivers/GopFramebuffer GopFramebuffer drivers_GopFramebuffer.diff
          apply unixnu/kits/VerifiedRoot VerifiedRoot kits_VerifiedRoot.diff
          apply unixnu/kits/XnuPrelink XnuPrelink kits_XnuPrelink.diff
          exit 0

      - name: Fetch the fuxi device tree
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          mkdir -p uefi-fuxi/Resources/DTBs
          for name in fuxi.dtb fuxi.dts; do
            curl -sSL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/hanzi123-bilp/uefi-fuxi/contents/Resources/DTBs/$name?ref=fuxi" \
              -o "uefi-fuxi/Resources/DTBs/$name"
          done
          ls -l uefi-fuxi/Resources/DTBs
          od -A n -t x1 -N 8 uefi-fuxi/Resources/DTBs/fuxi.dtb

      - name: Plan B - drop the USB debug stage when the marker exists
        working-directory: work
        run: |
          set -eux
          if [ ! -f ci/skip_usb_debug ]; then echo "USB debug stage kept"; exit 0; fi
          echo "marker present: removing the USB debug stage"
          for f in $(grep -rl "prepare-fuxi-usb-debug.py" device-ios17/scripts device/scripts 2>/dev/null); do
            perl -pi -e 's{^.*prepare-fuxi-usb-debug[.]py.*$}{true}g' "$f"
            echo "patched $f"
          done
          for c in device-ios17/configs/fuxi_ios17_kernel_defconfig device/configs/fuxi_ios17_kernel_defconfig; do
            [ -f "$c" ] && perl -ni -e 'print unless /usb-debug/' "$c" || true
          done

      - name: Download IPSW and extract the kernelcache
        working-directory: work
        run: |
          set -eux
          curl -sS -m 60 "https://api.ipsw.me/v4/device/iPhone15,2?type=ipsw" -o ipsw.json
          url=$(python3 -c "import json;d=json.load(open('ipsw.json'));print([f for f in d['firmwares'] if f['buildid']=='21H16'][0]['url'])")
          curl -L --retry 3 -o ipsw.zip "$url"
          member=$(unzip -l ipsw.zip | awk 'tolower($4) ~ /kernelcache/ {print $4}' | grep -i release | head -1)
          mkdir -p kernel
          unzip -o -q ipsw.zip "$member" -d kernel
          python3 -m pip install --quiet --break-system-packages lzfse || python3 -m pip install --quiet lzfse
          mkdir -p "$UNIXNU_OUT/ipsw/21H16"
          python3 tools/extract_kernelcache.py "kernel/$member" -o "$UNIXNU_OUT/ipsw/21H16/kernelcache.decompressed"
          ls -l "$UNIXNU_OUT/ipsw/21H16/kernelcache.decompressed"

      - name: Fetch the feeds and pin refer/xnu
        working-directory: work/unixnu
        run: |
          set +e
          DEV="$GITHUB_WORKSPACE/work/device-ios17"
          ./unixnu fetch -D "$DEV" 2>&1 | tail -20
          X="$UNIXNU_OUT/refer/xnu"
          if [ -d "$X/.git" ]; then
            echo "refer/xnu before: $(git -C "$X" rev-parse HEAD)"
            git -C "$X" fetch -q --depth 1 origin d8b80295118ef25ac3a784134bcf95cd8e88109f && git -C "$X" checkout -q d8b80295118ef25ac3a784134bcf95cd8e88109f
            echo "refer/xnu after:  $(git -C "$X" rev-parse HEAD)"
          else
            echo "no refer/xnu checkout"
          fi
          exit 0

      - name: Fetch the VerifiedRoot policies
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          B="https://api.github.com/repos/${{ github.repository }}"
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" "$B/actions/artifacts?name=verified-root-policies&per_page=1" -o art.json
          id=$(python3 -c "import json;d=json.load(open('art.json'));print(d['artifacts'][0]['id'] if d['artifacts'] else '')")
          [ -n "$id" ] || { echo "no verified-root-policies artifact yet"; exit 1; }
          echo "artifact $id"
          curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "$B/actions/artifacts/$id/zip" -o vr.zip
          rm -rf verified-root && mkdir verified-root
          unzip -q vr.zip -d verified-root
          find verified-root -maxdepth 2 -type f -exec ls -l {} +
          echo "VERIFIED_ROOT_DIR=$GITHUB_WORKSPACE/work/verified-root" >> "$GITHUB_ENV"

      - name: Instrument the archive builders
        working-directory: work
        run: |
          set -eux
          python3 "$GITHUB_WORKSPACE/work/ci/instrument_archive.py" "$PWD"

      - name: Build the kernel
        working-directory: work/unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eux
          ulimit -s 65536 || echo "could not raise the stack limit"
          ulimit -s
          grep -n "build-\|prepare-\|\.py" "$GITHUB_WORKSPACE/work/device-ios17/board.toml" | sed -n '1,40p' || true
          ./unixnu defconfig fuxi_ios17_kernel_defconfig -D "$GITHUB_WORKSPACE/work/device-ios17"
          set +e
          ./unixnu build kernel -D "$GITHUB_WORKSPACE/work/device-ios17" -j 8
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "== build failed rc=$rc"
            for f in $(ls -t "$UNIXNU_OUT"/fuxi/logs/*.log 2>/dev/null | head -3); do
              echo "=== $f"
              tail -60 "$f"
            done
            exit $rc
          fi
          find "$UNIXNU_OUT" -name kernel.macho | head

      - name: Diagnose the failing archive
        if: failure()
        working-directory: work/unixnu
        run: |
          set +e
          T="$GITHUB_WORKSPACE/work/unixnu/out-ios17/fuxi/tree"
          [ -d "$T" ] || { echo "no tree at $T"; ls out-ios17 || true; exit 0; }
          cd "$T"
          python3 scripts/build-arm-driver.py Adreno740 > /tmp/adreno.log 2>&1
          echo "rc=$?"
          wc -l /tmp/adreno.log
          echo "=== head"
          sed -n '1,25p' /tmp/adreno.log
          echo "=== markers"
          grep -n "Stack dump\|Program arguments\|current parser token\|error:\|clang-24 -\|clang-24: " /tmp/adreno.log | head -20

      - name: Encrypt the kernel
        if: always()
        working-directory: work
        run: |
          set +e
          python3 -m pip install --quiet --break-system-packages cryptography || python3 -m pip install --quiet cryptography
          k=$(find unixnu/out-ios17 -name kernel.macho | head -1)
          [ -n "$k" ] || { echo "no kernel.macho"; exit 0; }
          gzip -9 -n -c "$k" > kernel.macho.gz
          shasum -a 256 "$k" > kernel.macho.sha256
          python3 tools/pack_secret.py ci/recipient.pem secret kernel.macho.gz kernel.macho.sha256
          ls -l secret

      - name: Upload the encrypted kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-encrypted
          path: work/secret/*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-logs
          path: |
            work/unixnu/out-ios17/logs/*.log
            work/unixnu/out-ios17/*/logs/*.log
            work/unixnu/build/libpthread-kernel/*.log
          if-no-files-found: warn
          retention-days: 7